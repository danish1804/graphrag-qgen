# ── Document Processing ────────────────────────────────────
document:
  chunk_size: 500
  chunk_overlap: 50
  min_chunk_chars: 200

# ── Retrieval Parameters ───────────────────────────────────
retrieval:
  top_k_results: 3
  top_k_nodes: 3
  neighbour_depth: 1
  max_context_chunks: 6
