# ============================================================
# config.yml
# P000233DS — AI-Powered Automated Assessment System
# EdGenAI Technologies
#
# All system parameters are defined here.
# No values should be hardcoded in source files.
#
# User types:
#   Channel partner: Modify difficulty mappings, domains,
#                    question types per client requirement
#   Developer:       Modify retrieval and model parameters
# ============================================================

# ── Document Processing ────────────────────────────────────
document:
  chunk_size: 500          # Characters per chunk
  chunk_overlap: 50        # Overlap between chunks
  min_chunk_chars: 200     # Minimum chunk length to keep

# ── Retrieval Parameters ───────────────────────────────────
retrieval:
  top_k_results: 3         # Standard RAG — top K chunks
  top_k_nodes: 3           # GraphRAG — top K seed nodes
  neighbour_depth: 1       # GraphRAG — graph traversal depth
  max_context_chunks: 6    # Max chunks passed to LLM prompt
  # How a seed's neighbours are ranked for expansion (task 8).
  #   degree_discount : edge weight / degree^0.5   (current production)
  #   npmi_logcount   : NPMI(x,y) * log(1 + co-occurrence count)
  # Measured against the textbook-index relations, npmi_logcount gave
  # higher recall@5 and ~4-6x fewer rare-fragment neighbours (CHANGELOG
  # 2026-10-13). Production stays on degree_discount until confirmed
  # downstream.
  neighbour_weighting: degree_discount

# ── Domain Routing (GraphRAG 1.3) ──────────────────────────
# When a query is auto-routed (no explicit domain), compare the top
# two domain scores. If they are within margin_threshold, the query
# is boundary-spanning, so fall back to multi-domain retrieval
# regardless of difficulty. routing_confidence is always recorded in
# response metadata so evaluators can see how decisive routing was.
routing:
  margin_threshold: 0.05   # top-2 gap below this = ambiguous -> multi-domain

# ── Difficulty to Chunks Mapping ──────────────────────────
# Map the number of chunks to be extracted from
#         GraphRAG to the complexity of the question.
#         More concepts drawn = higher complexity.
# Channel partner can modify these mappings per client.
difficulty:
  easy:
    max_chunks: 3
    top_k_nodes: 2
    neighbour_depth: 1
    seed_ratio: 0.80     # 80% seed, 20% neighbour
    multi_domain: false
    description: "Basic recall and understanding"
  medium:
    max_chunks: 5
    top_k_nodes: 3
    neighbour_depth: 1
    seed_ratio: 0.60     # 60% seed, 40% neighbour
    multi_domain: false
    description: "Conceptual understanding and explanation"
  hard:
    max_chunks: 7
    top_k_nodes: 5
    neighbour_depth: 2
    seed_ratio: 0.40     # 40% seed, 60% neighbour
    multi_domain: true
    domain_score_threshold: 0.5  # Include domains if embedding score >= threshold
    chunks_per_domain: 7          # Per-domain chunk budget (defaults to max_chunks)
    description: "Application, analysis and evaluation"

# ── Question Types ─────────────────────────────────────────
# Channel partner can add/remove question types per client.

question_types:
  recall:
    description: "Define, list, state, identify, name"
    bloom_level: 1
  conceptual:
    description: "Explain, describe, compare, discuss"
    bloom_level: 2
  application:
    description: "Design, analyse, evaluate, derive, apply"
    bloom_level: 3
  case_study:
    description: "Realistic scenario then question grounded in that scenario"
    bloom_level: 4
    max_new_tokens: 280

# ── Document deduplication (admin upload / rebuild) ─────────
# Prevents re-processing PDFs that add zero nodes/edges to the graph.
#   1) Byte hash — identical files skipped immediately
#   2) Normalised text hash — same extracted text, different file bytes
#   3) Text similarity — near-duplicates (e.g. different publisher, minor header edits)
# Comparisons are scoped to the target domain only (see compare_scope).
deduplication:
  enabled: true
  similarity_threshold: 0.95
  on_exact_hash: skip
  on_high_similarity: skip
  compare_scope: domain
  max_similarity_comparisons: 25
  similarity_sample_chars: 15000

# ── Domain Configuration ───────────────────────────────────
# Channel partner can add new domains or disable existing ones
# by setting enabled: false
domains:
  deep_learning:
    enabled: true
    description: "Deep Learning — CNNs, pooling, backprop"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain deep_learning"
  database:
    enabled: true
    description: "Database Systems — SQL, transactions, indexing"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain database"
  software_engineering:
    enabled: true
    description: "Software Engineering — processes, patterns, testing"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain software_engineering"
  operating_systems:
    enabled: true
    description: "Operating Systems — processes, memory, scheduling"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain operating_systems"
  computer_architecture:
    enabled: true
    description: "Computer Architecture — CPU, memory hierarchy, pipelines"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain computer_architecture"


# Entity Filtering (GraphRAG)
# Alpha controls node creation quality threshold
# Beta controls edge creation strength threshold
#
# Alpha — Node filtering:
#   max_doc_freq:    entity in >X% of docs = too generic = removed
#   min_entity_freq: entity must appear ≥X times to be a node
#
# Beta — Edge filtering:
#   min_edge_weight: co-occurrence must be ≥X to create edge
#                    lower = denser graph = more connections
#                    higher = sparser graph = only strong links
#                    0 = no edges = GraphRAG degrades to RAG
graph:
  # Alpha parameters (node creation)
  alpha:
    max_doc_freq: 0.40      # Remove entities in >40% of chunks
    min_entity_freq: 2      # Entity must appear at least twice
    description: "Controls node quality — lower max_doc_freq
                  = stricter noise filtering"

  # Beta parameters (edge creation)
  beta:
    min_edge_weight: 2      # Minimum co-occurrence to create edge
    min_edge_freq: 2        # Minimum frequency of relationship
    description: "Controls graph density — higher min_edge_weight
                  = sparser graph = only strong concept links.
                  Set to 0 = no edges = degrades to standard RAG"

# ── Entity extraction profiles (task 7, 2026-10) ───────────
# v1 reproduces the indexes built on 20 Aug 2026 exactly (production).
# v2 applies the fixes found by the graph-quality report against the
# textbook indexes (docs/CHANGELOG.md, 2026-10-12/13). Select a profile
# per build with the env var GRAPHRAG_ENTITY_PROFILE or the indexer's
# --profile flag; the profile used is stored in each *_meta.json so the
# evaluation scripts normalise gold terms the same way the graph did.
entity_filter:
  active_profile: v1
  profiles:
    v1:
      singulariser: legacy             # "analysis"->"analysi"(rejected), "databases"->"databas"
      drop_ner_labels: []
      remove_generic_concepts: true    # drops process, network, data, set, type, ...
      strict_page_ranges: false        # "376 382" admitted as a concept
      digit_abbreviations: false       # 2pc, 2pl, 3pc rejected
      reject_doubled_chars: false      # "rrmmiitt ..." admitted
      extra_aliases: false
    v2:
      singulariser: v2                 # keeps -sis/-us/-ss words; databases->database
      drop_ner_labels: [CARDINAL, ORDINAL, QUANTITY, PERCENT, MONEY, DATE, TIME, PERSON]
      remove_generic_concepts: false   # genericness handled by weighting, not deletion
      strict_page_ranges: true         # numeric prefix only before processor/cpu/chip/...
      digit_abbreviations: true
      reject_doubled_chars: true
      extra_aliases: true              # two phase commit -> 2pc, etc.
    v3:                                # v2 + fixes found while measuring v2
      singulariser: v2
      drop_ner_labels: [CARDINAL, ORDINAL, QUANTITY, PERCENT, MONEY, DATE, TIME, PERSON]
      keep_technical_numeric_entities: true   # v2 dropped "3NF" as an ORDINAL
      strip_leading_determiners: true  # "its variable" -> "variable", "each signal" -> "signal"
      remove_generic_concepts: false
      extra_non_concepts: [number, size, step, case, approach]
      strict_page_ranges: true
      digit_abbreviations: true
      reject_doubled_chars: true
      extra_aliases: true


# ── Model Configuration ────────────────────────────────────
model:
  llm_name: "Qwen/Qwen2.5-7B-Instruct"
  embedding_model: "BAAI/bge-large-en-v1.5"
  max_new_tokens: 512              # legacy fallback
  max_new_tokens_question: 150
  max_new_tokens_answer: 512
  temperature: 0.7
  do_sample: true

# ── Prompt versioning ──────────────────────────────────────
prompts:
  version: "1.1.0"

# ── LLM as Judge ──────────────────────────────────────────
# Evaluates generated questions and answers for quality.
# Uses a smaller model than the generator to save VRAM.
# Qwen2.5-3B-Instruct chosen because:
#   - Same family as generator (Qwen 2.5 7B)
#   - Same tokenizer — no extra loading
#   - ~2GB in 4-bit — fits in remaining RTX 4060 VRAM
judge:
  judge_name: "Qwen/Qwen2.5-3B-Instruct"
  max_new_tokens: 512
  temperature: 0.1          # low temp for consistent scoring
  load_in_4bit: true
  min_gpu_free_gb: 0.3      # lowered for RTX 4060
  eval_output_dir: "outputs/evaluations"
  score_threshold: 3.5      # below this -> regenerate
  max_regenerations: 2      # max retry attempts
  # ── Judge backend (task 21) ──────────────────────────────
  # reuse_generator : same model grades itself (self-bias; current default)
  # local           : a separate local model (judge_name above)
  # api             : independent OpenAI-compatible endpoint (recommended)
  backend: api
  # ── Independent judge endpoints ──────────────────────────
  # Set backend: api and fill ONE of the presets below.
  # The judge must NOT be Qwen - that is the whole point.
  #
  # OpenRouter (recommended: one key, many models, no code change)
  #   base_url: "https://openrouter.ai/api/v1"
  #   model:    "anthropic/claude-3.5-haiku"   (or openai/gpt-4o-mini)
  #   api_version: ""
  #   NOTE: in OpenRouter's privacy settings, disable providers that
  #   train on prompts before sending anything corpus-derived.
  #
  # Azure OpenAI (sponsorship-covered)
  #   base_url: "https://<resource>.openai.azure.com"
  #   model:    "gpt-5-nano"          (your DEPLOYMENT name)
  #   api_version: "2024-10-21"       (required for Azure)
  #
  # Self-hosted vLLM on HPC (no data leaves the institution)
  #   base_url: "http://<host>:8000/v1"
  #   model:    "meta-llama/Llama-3.1-8B-Instruct"
  #   api_version: ""
  api:
    # Anthropic direct, via their OpenAI-SDK compatibility endpoint.
    # Chosen over OpenRouter because it puts one fewer party in front of
    # corpus-derived content, which is the binding NDA constraint.
    # Trailing slash matters.
    base_url: "https://api.anthropic.com/v1/"
    # Current Haiku. The older "claude-3-5-haiku-20241022" now returns
    # 404 not_found_error - that generation has been superseded.
    model: "claude-haiku-4-5-20251001"
    api_key_env: "JUDGE_API_KEY"   # env var holding the API key
    api_version: ""           # set ONLY for Azure OpenAI
    name: "claude-haiku-4.5 (direct)"   # recorded in eval provenance

# ── API Server ─────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  mode: "full"             # standard | full

# ── Fine-tuning (LoRA adapters) ────────────────────────────
# answer_lora  = friend QA fine-tune (question -> answer), folder at finetune_data/
# question_lora = GraphRAG prompt fine-tune (context+LO -> question), after train_question_lora.py
finetune:
  answer_lora_path: "finetune_data"
  question_lora_path: "finetune_data/question_lora"
  use_answer_lora: true
  use_question_lora: true   # set true after: python finetune_data/train_question_lora.py