# ============================================================
# config.yml
# P000233DS — AI-Powered Automated Assessment System
# EdGenAI Technologies
#
# All system parameters are defined here.
# No values should be hardcoded in source files.
#
# User types:
#   Channel partner: Modify difficulty mappings, domains,
#                    question types per client requirement
#   Developer:       Modify retrieval and model parameters
# ============================================================

# ── Document Processing ────────────────────────────────────
document:
  chunk_size: 500          # Characters per chunk
  chunk_overlap: 50        # Overlap between chunks
  min_chunk_chars: 200     # Minimum chunk length to keep

# ── Retrieval Parameters ───────────────────────────────────
retrieval:
  top_k_results: 3         # Standard RAG — top K chunks
  top_k_nodes: 3           # GraphRAG — top K seed nodes
  neighbour_depth: 1       # GraphRAG — graph traversal depth
  max_context_chunks: 6    # Max chunks passed to LLM prompt

# ── Difficulty to Chunks Mapping ──────────────────────────
# Map the number of chunks to be extracted from
#         GraphRAG to the complexity of the question.
#         More concepts drawn = higher complexity.
# Channel partner can modify these mappings per client.
difficulty:
  easy:
    max_chunks: 3
    top_k_nodes: 2
    neighbour_depth: 1
    description: "Basic recall and understanding"
  medium:
    max_chunks: 5
    top_k_nodes: 3
    neighbour_depth: 1
    description: "Conceptual understanding and explanation"
  hard:
    max_chunks: 7
    top_k_nodes: 5
    neighbour_depth: 2
    description: "Application, analysis and evaluation"

# ── Question Types ─────────────────────────────────────────
# Channel partner can add/remove question types per client.

question_types:
  recall:
    description: "Define, list, state, identify, name"
    bloom_level: 1
  conceptual:
    description: "Explain, describe, compare, discuss"
    bloom_level: 2
  application:
    description: "Design, analyse, evaluate, derive, apply"
    bloom_level: 3

# ── Domain Configuration ───────────────────────────────────
# Channel partner can add new domains or disable existing ones
# by setting enabled: false
domains:
  deep_learning:
    enabled: true
    description: "Deep Learning — CNNs, pooling, backprop"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain deep_learning"
  database:
    enabled: true
    description: "Database Systems — SQL, transactions, indexing"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain database"
  software_engineering:
    enabled: true
    description: "Software Engineering — processes, patterns, testing"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain software_engineering"
  operating_systems:
    enabled: true
    description: "Operating Systems — processes, memory, scheduling"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain operating_systems"
  computer_architecture:
    enabled: true
    description: "Computer Architecture — CPU, memory hierarchy, pipelines"
    rebuild_command: "python graphrag/graphrag_domain_indexer.py --domain computer_architecture"


# Entity Filtering (GraphRAG)
# Alpha controls node creation quality threshold
# Beta controls edge creation strength threshold
#
# Alpha — Node filtering:
#   max_doc_freq:    entity in >X% of docs = too generic = removed
#   min_entity_freq: entity must appear ≥X times to be a node
#
# Beta — Edge filtering:
#   min_edge_weight: co-occurrence must be ≥X to create edge
#                    lower = denser graph = more connections
#                    higher = sparser graph = only strong links
#                    0 = no edges = GraphRAG degrades to RAG
graph:
  # Alpha parameters (node creation)
  alpha:
    max_doc_freq: 0.40      # Remove entities in >40% of chunks
    min_entity_freq: 2      # Entity must appear at least twice
    description: "Controls node quality — lower max_doc_freq
                  = stricter noise filtering"

graph:
  # Alpha parameters (node creation)
  alpha:
    max_doc_freq: 0.40      # Remove entities in >40% of chunks
    min_entity_freq: 2      # Entity must appear at least twice
    description: "Controls node quality — lower max_doc_freq
                  = stricter noise filtering"

  # Beta parameters (edge creation)
  beta:
    min_edge_weight: 2      # Minimum co-occurrence to create edge
    min_edge_freq: 2        # Minimum frequency of relationship
    description: "Controls graph density — higher min_edge_weight
                  = sparser graph = only strong concept links.
                  Set to 0 = no edges = degrades to standard RAG"


# ── Model Configuration ────────────────────────────────────
model:
  llm_name: "Qwen/Qwen2.5-7B-Instruct"
  embedding_model: "BAAI/bge-large-en-v1.5"
  max_new_tokens: 512
  temperature: 0.7

# ── API Server ─────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  mode: "full"             # standard | full